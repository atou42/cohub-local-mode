name: cohub-local-mode

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: cohub
      POSTGRES_USER: cohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-54329}:5432"
    volumes:
      - "${COHUB_LOCAL_DATA_DIR:?COHUB_LOCAL_DATA_DIR is required}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cohub -d cohub"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6380}:6379"
    volumes:
      - "${COHUB_LOCAL_DATA_DIR:?COHUB_LOCAL_DATA_DIR is required}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:?MINIO_API_CORS_ALLOW_ORIGIN is required}
    ports:
      - "127.0.0.1:${LOCAL_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - "${COHUB_LOCAL_DATA_DIR:?COHUB_LOCAL_DATA_DIR is required}/objects:/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
