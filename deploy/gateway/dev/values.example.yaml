# Example deploy values. Copy to values.yaml and fill in your environment.
# Real environment values are not committed (see .gitignore).

# Dev 环境配置

# ========== 基础 ==========
NAMESPACE: "cohub-dev"
APP_NAME: "cohub-gateway-dev"

# ========== 镜像 ==========
IMAGE_REPOSITORY: "ghcr.io/example/cohub-gateway"
IMAGE_TAG: "main-17f713a"
IMAGE_PULL_POLICY: "Always"
IMAGE_PULL_SECRET: "registry-pull-secret"

# ========== 服务端口 ==========
SERVICE_PORT: "8788"
CONTAINER_PORT: "8788"

# ========== 副本与资源 ==========
REPLICAS: "1"
REQUEST_CPU: "100m"
REQUEST_MEMORY: "128Mi"
LIMIT_CPU: "500m"
LIMIT_MEMORY: "512Mi"

# ========== 健康检查 ==========
LIVENESS_PATH: "/healthz"
LIVENESS_INITIAL_DELAY: "10"
LIVENESS_PERIOD: "10"
LIVENESS_TIMEOUT: "2"
LIVENESS_FAILURE_THRESHOLD: "3"
READINESS_PATH: "/readyz"
READINESS_INITIAL_DELAY: "5"
READINESS_PERIOD: "5"
READINESS_TIMEOUT: "2"
READINESS_FAILURE_THRESHOLD: "3"

# ========== Gateway 配置 ==========
GATEWAY_OUTBOUND_CONCURRENCY: "16"
API_BASE_URL: "http://cohub-api-dev.cohub-dev.svc.cluster.local:8787"
LOGTO_ENDPOINT: "https://auth-dev.example.com"

# ========== 路由配置 ==========
ROUTE_ENABLED: "true"
GATEWAY_HOSTNAMES: "gateway-dev.cohub.live,gateway-dev.cohub.run"

# ========== 环境标识 ==========
ENV: "dev"
LOG_LEVEL: "debug"
TERMINATION_GRACE_PERIOD_SECONDS: "120"
