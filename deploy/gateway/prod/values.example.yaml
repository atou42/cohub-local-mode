# Example deploy values. Copy to values.yaml and fill in your environment.
# Real environment values are not committed (see .gitignore).

# Prod 环境配置

# ========== 基础 ==========
NAMESPACE: "cohub"
APP_NAME: "cohub-gateway"

# ========== 镜像 ==========
IMAGE_REPOSITORY: "ghcr.io/example/cohub-gateway"
IMAGE_TAG: "v1.43.0"
IMAGE_PULL_POLICY: "IfNotPresent"
IMAGE_PULL_SECRET: "registry-pull-secret"

# ========== 服务端口 ==========
SERVICE_PORT: "8788"
CONTAINER_PORT: "8788"

# ========== 副本与资源 ==========
REPLICAS: "2"
REQUEST_CPU: "200m"
REQUEST_MEMORY: "256Mi"
LIMIT_CPU: "1000m"
LIMIT_MEMORY: "1Gi"

# ========== 健康检查 ==========
LIVENESS_PATH: "/healthz"
LIVENESS_INITIAL_DELAY: "10"
LIVENESS_PERIOD: "10"
LIVENESS_TIMEOUT: "2"
LIVENESS_FAILURE_THRESHOLD: "3"
READINESS_PATH: "/readyz"
READINESS_INITIAL_DELAY: "5"
READINESS_PERIOD: "5"
READINESS_TIMEOUT: "2"
READINESS_FAILURE_THRESHOLD: "3"

# ========== Gateway 配置 ==========
GATEWAY_OUTBOUND_CONCURRENCY: "16"
API_BASE_URL: "http://cohub-api.cohub.svc.cluster.local:8787"
LOGTO_ENDPOINT: "https://auth.example.com"

# ========== 路由配置 ==========
ROUTE_ENABLED: "true"
GATEWAY_HOSTNAMES: "gateway.cohub.live,gateway.cohub.run"

# ========== 环境标识 ==========
ENV: "prod"
LOG_LEVEL: "info"
TERMINATION_GRACE_PERIOD_SECONDS: "120"
